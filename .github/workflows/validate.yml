name: Validate public previews
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_preview.py
      - run: node --check docs/site.js
      - run: python scripts/browser_smoke.py
